  #   ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: 国外}
  #   domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs, proxy: 国外}
  #   class: &class {type: http, interval: 86400, behavior: classical, format: text, proxy: 国外}
