  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text, header: {User-Agent: ["clash.meta/v0.0.0 (fnSoar/1.0.76)"]}}


