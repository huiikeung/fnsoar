# ========================================
# 规则引擎
# ========================================
rules:
  # ====== 最高优先级：内网直连 ======
  - GEOIP,private,DIRECT,no-resolve
  - GEOIP,CN,国内,no-resolve

  # 广告拦截
  - RULE-SET,Block / Domain,广告拦截

  # 人工智能
  - RULE-SET,ChatGPT / Domain,人工智能
  - RULE-SET,Claude / Domain,人工智能
  - RULE-SET,Copilot / Domain,人工智能
  - RULE-SET,Gemini / Domain,人工智能
  - RULE-SET,Groq / Domain,人工智能
  - RULE-SET,Grok / Domain,人工智能
  - RULE-SET,Meta AI / Domain,人工智能
  - RULE-SET,Perplexity / Domain,人工智能

  # 特殊规则
  - RULE-SET,Google / Domain,谷歌
  - RULE-SET,Google / IP,谷歌

  # 大公司服务
  - RULE-SET,Microsoft / Domain,微软
  - RULE-SET,Apple / Domain,苹果
  - RULE-SET,Apple-CN / Domain,苹果
  - RULE-SET,Apple-Custome / Domain,苹果

  # 加密货币
  - RULE-SET,Crypto / Domain,加密货币
  - RULE-SET,OKX / Domain,加密货币
  - RULE-SET,Bybit / Domain,加密货币
  - RULE-SET,Binance / Domain,加密货币

  # 媒体服务
